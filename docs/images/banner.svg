<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="RICH LINUX — XFCE di Chrome Remote Desktop">
  <title>RICH LINUX — XFCE di Chrome Remote Desktop</title>
  <desc>Banner: Ubuntu 24.04, XFCE 4.18, tanpa compositor, 1280x720, diakses lewat Chrome Remote Desktop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity="0.5"/>
  <ellipse cx="1100" cy="20" rx="430" ry="240" fill="url(#glow)"/>
  <ellipse cx="160" cy="330" rx="340" ry="180" fill="url(#glow2)"/>

  <!-- eyebrow -->
  <text x="64" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="2" fill="#94a3b8">UBUNTU 24.04 · 4 vCPU · 16 GB RAM · 6H MAX</text>

  <!-- title -->
  <text x="64" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">RICH <tspan fill="url(#titleGrad)">LINUX</tspan></text>

  <!-- subtitle -->
  <text x="64" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Arial, sans-serif"
        font-size="24" font-weight="500"><tspan fill="#e2e8f0">XFCE 4.18</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#94a3b8">Chrome Remote Desktop</tspan></text>

  <!-- accent -->
  <rect x="64" y="230" width="72" height="4" rx="2" fill="#6366f1"/>

  <!-- badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">
    <rect x="64" y="252" width="126" height="32" rx="16" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
    <text x="127" y="273" text-anchor="middle" fill="#c7d2fe">NO COMPOSITOR</text>

    <rect x="202" y="252" width="96" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="273" text-anchor="middle" fill="#cbd5e1">LIGHTWEIGHT</text>

    <rect x="310" y="252" width="104" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="362" y="273" text-anchor="middle" fill="#cbd5e1">1280x720</text>

    <rect x="426" y="252" width="150" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="501" y="273" text-anchor="middle" fill="#cbd5e1">CHROME REMOTE DESKTOP</text>

    <rect x="588" y="252" width="112" height="32" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="644" y="273" text-anchor="middle" fill="#cbd5e1">CATPPUCCIN</text>
  </g>

  <!-- right accent panel -->
  <g opacity="0.85">
    <rect x="900" y="70" width="316" height="180" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="900" y="70" width="316" height="30" rx="14" fill="#1e293b"/>
    <circle cx="922" cy="85" r="4" fill="#f38ba8"/>
    <circle cx="938" cy="85" r="4" fill="#f9e2af"/>
    <circle cx="954" cy="85" r="4" fill="#a6e3a1"/>
    <text x="970" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">xfce4-session</text>

    <text x="922" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">use_compositing = false</text>
    <text x="922" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">EnableAnimations = false</text>
    <text x="922" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">idle CPU  ~0%  ·  RAM idle < 600 MB</text>
    <text x="922" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">build < 15 menit · cache warm < 7 menit</text>

    <rect x="922" y="218" width="272" height="4" rx="2" fill="#6366f1" opacity="0.55"/>
  </g>
</svg>
