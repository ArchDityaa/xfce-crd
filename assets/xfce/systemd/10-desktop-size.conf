[Service]
# Chrome Remote Desktop (versi >= 120) membaca environment variable ini untuk
# menentukan ukuran desktop virtual:
#
#   CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=WIDTHxHEIGHT[,WIDTHxHEIGHT...]
#
# Default upstream: 1600x1200,3840x2560. Kita set 1280x720 supaya:
#   - rasio 16:9 (bukan 4:3),
#   - jumlah piksel ~0.92 MP (hampir sama dengan 1024x768 tapi jauh lebih
#     sedikit daripada 1920x1080 = 2.07 MP),
#   - biaya render software (llvmpipe) + capture frame CRD tetap rendah.
#
# Drop-in ini membuat daemon CRD mendaftarkan mode 1280x720 di RandR dan
# menjadikannya initial mode. Helper /usr/local/bin/set-resolution.sh tetap ada
# sebagai jaring pengaman (fallback ke 1024x768 mode native).
Environment="CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1280x720"
